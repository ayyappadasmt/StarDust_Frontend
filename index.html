<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Background video */
#bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* Main chat container ONLY */
.container {
    width: 850px;
    height: 90vh;
    background: rgba(10, 15, 35, 0.65);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Header */
.header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header h1 {
    font-size: 20px;
    font-weight: 600;
}

.header p {
    font-size: 12px;
    opacity: 0.6;
}

/* Session info */
.session-info {
    padding: 10px 20px;
    font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* Chat area */
.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Messages */
.message {
    margin-bottom: 15px;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
}

/* User bubble */
.message.user .message-content {
    background: linear-gradient(135deg, #3a7bd5, #00d2ff);
    color: white;
}

/* Assistant bubble */
.message.assistant .message-content {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
}

/* Input area */
.input-container {
    display: flex;
    padding: 15px;
    border-top: 1px solid rgba(255,255,255,0.08);
}

#messageInput {
    flex: 1;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
    outline: none;
}

#messageInput::placeholder {
    color: rgba(255,255,255,0.5);
}

button {
    margin-left: 10px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #3a7bd5, #00d2ff);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- Galaxy Background -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="assets/galaxy.mp4" type="video/mp4">
</video>



<div class="container">

    <div class="header">
        <h1>StarDust</h1>
        <p>Explore StarDust.Explore yourself.</p>
    </div>

    <div class="session-info">
        <span>Session ID:</span>
        <span id="sessionId">Not started</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="message-content">
                Hello. How can I assist you today?
            </div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="sendButton">Send</button>
    </div>

</div>

<script>
let currentCheckpointId = null;
let isStreaming = false;
const API_BASE_URL = "https://stardust-backend-6zjp.onrender.com";

function addMessage(role, content) {
    const chatContainer = document.getElementById("chatContainer");
    const messageDiv = document.createElement("div");
    messageDiv.className = "message " + role;
    messageDiv.innerHTML = "<div class='message-content'></div>";
    messageDiv.querySelector(".message-content").textContent = content;
    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return messageDiv;
}

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message || isStreaming) return;

    addMessage("user", message);
    input.value = "";

    isStreaming = true;
    document.getElementById("sendButton").disabled = true;

    const url = new URL(`${API_BASE_URL}/chat_stream/${encodeURIComponent(message)}`);
    if (currentCheckpointId) {
        url.searchParams.append("checkpoint_id", currentCheckpointId);
    }

    try {
        const response = await fetch(url);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantMessage = null;
        let accumulated = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");

            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    const data = JSON.parse(line.slice(6));

                    if (data.type === "checkpoint") {
                        currentCheckpointId = data.checkpoint_id;
                        document.getElementById("sessionId").textContent =
                            data.checkpoint_id.substring(0, 8) + "...";
                    }

                    if (data.type === "content") {
                        if (!assistantMessage) {
                            assistantMessage = addMessage("assistant", "");
                        }
                        accumulated += data.content;
                        assistantMessage.querySelector(".message-content").textContent = accumulated;
                    }
                }
            }
        }

    } catch (error) {
        addMessage("assistant", "Server connection failed.");
    }

    isStreaming = false;
    document.getElementById("sendButton").disabled = false;
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}
</script>

</body>
</html>
